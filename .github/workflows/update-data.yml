name: Update CSV and Visualization

on:
  schedule:
    # 每周一 03:17 UTC (北京时间周一 11:17), 避开整点高峰
    - cron: '17 3 * * 1'
  workflow_dispatch:  # 支持在 Actions 页面手动触发

permissions:
  contents: write  # 允许 workflow 提交回 main

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl latest repositories
        env:
          # workflow 自带的 GITHUB_TOKEN, 认证模式 5000 次/小时
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python reptile_security.py awesome_security_repo.csv

      - name: Regenerate visualization charts
        run: python update_visualization.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add awesome_security_repo.csv images/top_repositories.png images/trend_repositories.png
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update CSV and visualization charts

          Generated by GitHub Actions workflow.
          Co-Authored-By: Claude <noreply@anthropic.com>"
            git push
          fi
